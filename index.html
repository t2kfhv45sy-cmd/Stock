<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kicks&amp;Threads WTS</title>
<meta name="description" content="Kicks&amp;Threads · sneakers disponibili ora: modelli e taglie. Scrivici per prezzi e foto.">
<meta property="og:title" content="Kicks&amp;Threads · WTS">
<meta property="og:description" content="Sneakers disponibili ora: modelli e taglie.">
<meta property="og:image" content="img/logo.webp">
<meta name="theme-color" content="#292929">
<link rel="icon" href="img/logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Fredoka:wght@500;600;700&family=Libre+Baskerville:wght@700&display=swap">
<style>*,*::before,*::after{box-sizing:border-box}html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<style>
/* Layout: brand header like the logo badge, then a shelf of cards styled like the stock stories (charcoal, beige, orange) */
:root {
  --bg: #292929;
  --card: #1D1D1D;
  --beige: #F0E0C9;
  --brown: #5A3D2D;
  --orange: #DD5120;
  --muted: #B8A992;
  --line: #3A3634;
  --script: "Shrikhand", "Cooper Black", Georgia, serif;
  --display: "Fredoka", "Arial Rounded MT Bold", system-ui, sans-serif;
  --serif: "Libre Baskerville", Georgia, "Times New Roman", serif;
  color-scheme: dark;
}
body { background: var(--bg); color: var(--beige); font-family: var(--display); font-size: 15px; line-height: 1.45; }
.wrap { max-width: 1280px; margin: 0 auto; padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header { display: grid; justify-items: center; text-align: center; gap: 10px; padding-bottom: 26px; margin-bottom: 26px;
  border-bottom: 2px solid var(--line); }
.wordmark { width: min(420px, 86vw); height: auto; display: block; }
.logo { width: 132px; height: auto; display: block; }
h1 { font-family: var(--script); font-weight: 400; font-size: clamp(40px, 9vw, 64px); line-height: 1.05; margin: 0;
  color: var(--beige); -webkit-text-stroke: 7px var(--brown); paint-order: stroke fill;
  text-shadow: 0 4px 0 var(--brown); letter-spacing: .01em; text-wrap: balance; }
.tag { font-family: var(--serif); font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0; }
.meta { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 14px; font-family: var(--serif); font-size: 12px;
  letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-variant-numeric: tabular-nums; }
.meta b { color: var(--orange); }

.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (min-width: 640px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (min-width: 900px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; } }
@media (min-width: 1150px) { .grid { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
.card { background: var(--card); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column;
  box-shadow: 0 0 0 1px var(--line); }
.shot { aspect-ratio: 7 / 5; max-width: 100%; background: #FFFFFF; display: grid; place-items: center; }
.shot img { width: 100%; height: 100%; object-fit: contain; padding: 6px; }
.ph { display: grid; justify-items: center; gap: 8px; color: #9C8F7E; font-family: var(--serif); font-size: 11px;
  text-transform: uppercase; letter-spacing: .12em; }
.ph svg { width: 64px; height: auto; }
.info { padding: 10px 12px 12px; display: grid; gap: 10px; flex: 1; align-content: space-between; }
.name { font-family: var(--display); font-weight: 700; font-size: 15px; line-height: 1.2; margin: 0; text-wrap: balance; color: var(--beige); }
.sizes { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; }
.size { font-family: var(--serif); font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: .02em;
  color: var(--beige); border: 1.5px solid var(--orange); border-radius: 999px; padding: 3px 8px; white-space: nowrap;
  font-variant-numeric: tabular-nums; }
.size span { color: var(--muted); font-weight: 400; }

.empty { padding: 40px 16px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 14px; grid-column: 1 / -1; }
footer { margin-top: 34px; text-align: center; font-family: var(--serif); font-size: 11px; letter-spacing: .12em;
  text-transform: uppercase; color: var(--muted); }
:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
</style>

</head>
<body>
<div class="wrap">
  <header>
    <img class="logo" src="img/logo.webp" alt="Logo Kicks&amp;Threads">
    <img class="wordmark" src="img/wordmark.png" alt="Kicks&amp;Threads" onerror="this.hidden=true;document.getElementById('wm').hidden=false">
    <h1 id="wm" hidden>Kicks&amp;Threads</h1>
    <p class="tag">WTS · Stock</p>
    <div class="meta">
      <span><b id="count">–</b> modelli</span>
      <span><b id="pairs">–</b> paia</span>
      <span id="updated"></span>
    </div>
  </header>

  <main class="grid" id="grid" aria-live="polite"></main>
  <footer>Kicks&amp;Threads.resell</footer>
</div>

<script>
const SNEAKER = '<svg viewBox="0 0 120 56" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M6 44 L8 22 Q10 14 20 16 L40 22 Q52 26 60 18 L70 10 Q76 6 80 12 L86 24 Q92 32 106 36 Q116 39 114 46 L112 48 L8 48 Z"/><path d="M6 48 L114 48"/><path d="M48 24 L54 34 M58 20 L64 31 M68 14 L73 27"/></svg>';

// own photo first (img/<slug>.webp), then the official StockX photo, then a placeholder
function fotoFallback(img){
  const f = img.dataset.foto;
  if (f) { img.removeAttribute('data-foto'); img.src = f; return; }
  img.replaceWith(Object.assign(document.createElement('div'), { className: 'ph', innerHTML: SNEAKER + 'Foto in arrivo' }));
}

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function card(p){
  const sizes = p.taglie.map(t => `<span class="size">EU ${esc(t.eu)}${t.us ? ' <span>/ US ' + esc(t.us) + '</span>' : ''}</span>`).join('');
  return `<article class="card">
    <div class="shot">
      <img src="img/${esc(p.slug)}.webp" alt="${esc(p.nome)}" loading="lazy" referrerpolicy="no-referrer"${p.foto ? ` data-foto="${esc(p.foto)}"` : ''} onerror="fotoFallback(this)">
    </div>
    <div class="info">
      <h2 class="name">${esc(p.nome)}</h2>
      <div class="sizes">${sizes}</div>
    </div>
  </article>`;
}

async function load(){
  const grid = document.getElementById('grid');
  try {
    const res = await fetch('stock.json', { cache: 'no-store' });
    const data = await res.json();
    const list = (data.paia || []).filter(p => p.taglie && p.taglie.length);
    document.getElementById('count').textContent = list.length;
    document.getElementById('pairs').textContent = list.reduce((n, p) => n + p.taglie.length, 0);
    if (data.aggiornato) {
      const d = new Date(data.aggiornato);
      document.getElementById('updated').textContent = 'Aggiornato il ' + d.toLocaleDateString('it-IT', { day: 'numeric', month: 'long' });
    }
    grid.innerHTML = list.length ? list.map(card).join('') : '<div class="empty">Nessun paio disponibile in questo momento. Ricontrolla presto.</div>';
  } catch (e) {
    grid.innerHTML = '<div class="empty">Non riesco a caricare la lista. Ricarica la pagina tra qualche secondo.</div>';
  }
}
load();
</script>
</body>
</html>
